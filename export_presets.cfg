; Export presets per docs/ARCHITECTURE.md Section 1 ("Android and iOS")
; and CLAUDE.md Phase 10. PLACEHOLDER identifiers below (package name,
; bundle ID, version) -- these are product/publishing decisions the
; project owner must set to real values before an actual store
; submission; they are NOT invented design decisions, just enough of a
; valid preset to make `godot --export-release <preset> <path>` runnable
; once export templates + the Android SDK (or Xcode, for iOS) are
; installed. See docs/PROGRESS.md "Phase 10" for what is genuinely
; blocked in this environment (no SDK/templates/device here) versus
; what this file itself unblocks (a real preset to export from, once
; the owner has that tooling on their own machine).

